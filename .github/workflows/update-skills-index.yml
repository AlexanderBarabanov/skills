name: Update Skills Index

on:
  push:
    branches:
      - "main"
      - "release-*"
    paths:
      - "skills-config.json"
      - "skills-config.schema.json"
  # Run every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      install:
        description: "Sync skills into .agents/skills/ (true/false)"
        required: false
        default: "true"
      dry_run:
        description: "Preview changes without writing files or opening a pull request (true/false)"
        required: false
        default: "false"
      branch:
        description: "Branch of open-edge-platform/skills to verify with npx skills add"
        required: false
        default: "main"

permissions: {}

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] -- caching explicitly disabled via cache: ""
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install JSON schema validator
        run: python3 -m pip install -r requirements.txt

      - name: Validate skills config
        run: check-jsonschema --schemafile skills-config.schema.json skills-config.json

      - name: Sync skills and update README index
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INSTALL: ${{ inputs.install || 'true' }}
          NPM_CONFIG_YES: "true"
        run: |
          npm ci
          echo "Node.js version:"
          node --version
          echo "npx version:"
          npx --version
          echo "skills version:"
          npx skills --version
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$INSTALL" = "false" ]; then
            FLAGS="$FLAGS --no-install"
          fi
          python3 scripts/update_skills_index.py $FLAGS

      # GitHub App token is required to open a PR
      - name: Get GitHub App token
        if: ${{ inputs.dry_run != 'true' }}
        id: get-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SKILLS_APP_ID }}
          private-key: ${{ secrets.SKILLS_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Repository permissions: only what's needed to push a branch and open a PR
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request if anything changed
        if: ${{ inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
          # FIXME: hardcoded for testing in the AlexanderBarabanov fork — replace oep-skills[bot]'s
          # numeric user id (see https://api.github.com/users/oep-skills%5Bbot%5D) before merging upstream.
          author: "oep-skills[bot] <oep-skills[bot]@users.noreply.github.com>"
          committer: "oep-skills[bot] <oep-skills[bot]@users.noreply.github.com>"
          add-paths: |
            README.md
            .agents/skills/
          commit-message: |
            chore: sync skills and update README index

            Installed/updated selected skills from skills-config.json and rebuilt README.
          title: "chore: sync skills and update README index"
          body: |
            Automated sync of `.agents/skills/` and `README.md` from `skills-config.json`
            (triggered by `${{ github.event_name }}`).
          branch: "update-skills-index-${{ github.run_id }}"
          base: ${{ github.ref_name }}
          delete-branch: true
          reviewers: sys-siv-oep

      - name: Verify skills installation
        env:
          VERIFY_BRANCH: ${{ inputs.branch || github.ref_name }}
          NPM_CONFIG_YES: "true"
          DISABLE_TELEMETRY: "1"
        run: |
          REPO="open-edge-platform/skills"
          if [ "${VERIFY_BRANCH}" = "main" ]; then
            SOURCE="$REPO"
          else
            SOURCE="$REPO#${VERIFY_BRANCH}"
          fi
          npx skills add "$SOURCE" --list
          npx skills add "$SOURCE" --skill '*' --agent claude-code --agent github-copilot --agent codex --global --yes
